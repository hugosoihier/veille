<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1220">
  <meta name="robots" content="noindex, nofollow">
  <title>Tableau de bord · SGC-NUM</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <script>try{var t=JSON.parse(localStorage.getItem('veille.settings')||'{}').theme;document.documentElement.dataset.theme=t==='light'?'light':'dark';}catch(e){document.documentElement.dataset.theme='dark';}</script>
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="home">
  <header class="top">
    <div class="brand" id="brand">Tableau de bord · Veille</div>
    <nav>
      <a href="index.html" class="active">Accueil</a>
      <a href="veille.html">Veille</a>
      <a href="infos.html">Infos</a>
      <a href="reglages.html">Réglages</a>
    </nav>
    <div class="stale" id="stale" hidden></div>
  </header>

  <main class="home">
    <section class="hero">
      <div class="clock">
        <div id="time" class="time">--:--</div>
        <div id="date" class="date"></div>
      </div>
      <div class="level" id="level"></div>
      <div class="weather" id="weather"></div>
    </section>

    <section class="kpis" id="kpis" aria-label="Chiffres de la semaine"></section>

    <section class="panel">
      <h2>À retenir cette semaine</h2>
      <ol id="top" class="list"></ol>
    </section>

    <aside class="side">
      <section class="panel">
        <h2>Prochaines échéances</h2>
        <ul id="deadlines" class="plain"></ul>
      </section>
      <section class="panel">
        <h2>État des services</h2>
        <ul id="services" class="plain"></ul>
      </section>
    </aside>

    <section class="panel full">
      <h2>À la une</h2>
      <ul id="news" class="news-strip"></ul>
    </section>
  </main>

  <footer id="foot"></footer>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <button class="close" id="close" aria-label="Fermer">✕</button>
      <div id="modal-body"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>

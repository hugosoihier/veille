name: Mise à jour des données de veille

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "config.json"
      - "scripts/**"
      - "requirements-translate.txt"
      - ".github/workflows/update.yml"

permissions:
  contents: write

concurrency:
  group: veille-update
  cancel-in-progress: false

env:
  REMOTE: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-translate.txt

      - name: Récupérer les données précédentes
        run: sh scripts/restore_data.sh "$REMOTE"

      - name: Collecte des flux
        run: python scripts/fetch_feeds.py

      - name: Compter les textes à traduire
        id: pending
        run: python scripts/translate_items.py --count

      - name: Modèle de traduction (cache)
        if: steps.pending.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-fr-v1

      - name: Installer le traducteur
        if: steps.pending.outputs.count != '0'
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-translate.txt

      - name: Traduction en français
        if: steps.pending.outputs.count != '0'
        continue-on-error: true
        run: python scripts/translate_items.py

      - name: Publier data.json (branche data)
        if: always()
        run: sh scripts/publish_data.sh "$REMOTE"

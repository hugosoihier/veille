name: Mise à jour des données de veille

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "config.json"
      - "scripts/**"
      - "requirements-translate.txt"

permissions:
  contents: write

concurrency:
  group: veille-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-translate.txt

      - name: Collecte des flux
        run: python scripts/fetch_feeds.py

      - name: Compter les textes à traduire
        id: pending
        run: python scripts/translate_items.py --count

      - name: Modèle de traduction (cache)
        if: steps.pending.outputs.count != '0'
        uses: actions/cache@v4
        with:
          path: ~/.local/share/argos-translate
          key: argos-en-fr-v1

      - name: Installer le traducteur
        if: steps.pending.outputs.count != '0'
        continue-on-error: true
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-translate.txt

      - name: Traduction en français
        if: steps.pending.outputs.count != '0'
        continue-on-error: true
        run: python scripts/translate_items.py

      - name: Publier data.json
        if: always()
        run: |
          git config user.name "veille-bot"
          git config user.email "veille-bot@users.noreply.github.com"
          git add data.json || true
          if git diff --cached --quiet; then
            echo "Rien de nouveau."
          else
            git commit -m "Mise à jour des données"
            git pull --rebase origin main || true
            git push
          fi

name: Appli Android (APK)

# Compile l'APK à chaque modification du dossier android/ et la publie dans la Release « apk ».
# Secrets nécessaires (Settings → Secrets and variables → Actions) :
#   ANDROID_KEYSTORE_B64  : la clé de signature veille.keystore encodée en base64
#   ANDROID_KEYSTORE_PASS : son mot de passe
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: SDK Android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Clé de signature
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KS_B64" ]; then echo "::error::Secret ANDROID_KEYSTORE_B64 manquant"; exit 1; fi
          printf '%s' "$KS_B64" | tr -d '\r\n ' | base64 -d > "$RUNNER_TEMP/veille.keystore"

      - name: Compilation
        env:
          KEYSTORE: ${{ runner.temp }}/veille.keystore
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.3.${{ github.run_number }}
        run: |
          export VERSION_CODE=$((VERSION_CODE + 100))
          sh android/build.sh

      - name: Publication (Release « apk »)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk android/Veille.apk --title "Appli Android Veille" --latest \
            --notes "APK compilée automatiquement depuis le dossier android/ (commit ${GITHUB_SHA::7}). Installer sur la tablette : télécharger Veille.apk puis l'ouvrir."
